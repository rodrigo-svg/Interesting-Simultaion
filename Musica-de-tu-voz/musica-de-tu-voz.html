<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1c2e">
<meta name="description" content="Escucha tu voz, encuentra su frecuencia y crea música tranquila afinada a ella.">
<title>La música de tu voz</title>
<style>
:root{
  color-scheme:dark;
  --noche:#1a1c2e;      /* fondo */
  --bruma:#262a44;      /* superficies */
  --tinta:#ecebf5;      /* texto */
  --niebla:#9c9fbd;     /* texto secundario */
  --linea:#3a3f61;      /* bordes */
  --voz:#b9a7f0;        /* color de la voz: cambia con la nota detectada */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--noche);color:var(--tinta);
  font:300 16px/1.5 ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
main{
  min-height:100%;max-width:520px;margin:auto;
  padding:max(clamp(32px,11vh,110px),env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
}
h1{margin:0;font-size:17px;font-weight:400;letter-spacing:.02em;color:var(--niebla)}
button,input,label{font:inherit;color:inherit}

.aro{
  position:relative;width:min(84vw,380px);aspect-ratio:1;padding:0;border:0;border-radius:50%;
  background:none;cursor:pointer;touch-action:manipulation;
}
.aro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.valor{font-size:clamp(32px,10vw,46px);font-weight:200;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.valor small{font-size:.42em;font-weight:300;color:var(--niebla);margin-left:.25em;letter-spacing:.02em}
.nota{font-size:18px;color:var(--voz);min-height:27px;transition:color 1.2s}
.aro:focus-visible{outline:2px solid var(--voz);outline-offset:6px}

.pista{margin:0;min-height:48px;color:var(--niebla);max-width:30ch}
.pista.aviso{color:#f3c4a5}

.resonancias{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:baseline;margin:0;padding:0;color:var(--niebla);font-size:14px;font-variant-numeric:tabular-nums}
.resonancias dt{flex-basis:100%;font-size:13px}
.resonancias dd{margin:0;color:var(--tinta)}

.controles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:4px}
.boton{
  display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:22px;
  border:1px solid var(--linea);background:none;cursor:pointer;font-size:15px;color:var(--tinta);
}
.boton:hover{border-color:var(--voz)}
.boton:focus-visible,.archivo:focus-within{outline:2px solid var(--voz);outline-offset:3px}
.archivo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.volumen{display:flex;align-items:center;gap:10px;flex-basis:100%;justify-content:center;font-size:14px;color:var(--niebla);min-height:44px}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(52vw,220px);height:28px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--linea);border-radius:1px}
input[type=range]::-moz-range-track{height:2px;background:var(--linea);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:var(--voz);border:0}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--voz);border:0}
input[type=range]:focus-visible{outline:2px solid var(--voz);outline-offset:3px;border-radius:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>La música de tu voz</h1>

  <button class="aro" id="aro" type="button" aria-describedby="pista">
    <canvas id="lienzo" aria-hidden="true"></canvas>
    <span class="centro">
      <span class="valor" id="valor">Escuchar</span>
      <span class="nota" id="nota"></span>
    </span>
  </button>

  <p class="pista" id="pista" role="status">Toca y sostén una «aaa» unos segundos.</p>

  <dl class="resonancias" id="resonancias" hidden>
    <dt>Resonancias de tu voz</dt>
  </dl>

  <div class="controles">
    <label class="volumen" id="volumen" hidden>Volumen
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7">
    </label>
    <button class="boton" id="otra" type="button" hidden>Grabar otra voz</button>
    <label class="boton archivo">Subir un audio
      <input type="file" id="archivo" accept="audio/*,video/mp4,video/webm">
    </label>
  </div>
</main>

<script>
'use strict';
/* ===== Análisis de la voz ===================================================
   Tono fundamental (f0) con YIN y resonancias del tracto vocal (formantes)
   con predicción lineal. Funciones puras: se prueban fuera del navegador. */
//<dsp>
const F_MIN = 60, F_MAX = 520;      // rango de voz hablada y cantada grave/media
const ENV_BINS = 256, ENV_MAX = 4000; // rejilla de la envolvente espectral (Hz)

function decimar(x, factor) {
  if (factor <= 1) return x;
  const n = Math.floor(x.length / factor), y = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let k = 0; k < factor; k++) s += x[i * factor + k];
    y[i] = s / factor;
  }
  return y;
}

function rms(x) {
  let s = 0;
  for (let i = 0; i < x.length; i++) s += x[i] * x[i];
  return Math.sqrt(s / x.length);
}

// YIN: periodo como primer mínimo profundo de la diferencia normalizada.
function tono(x, sr) {
  const tauMin = Math.max(2, Math.floor(sr / F_MAX));
  const tauMax = Math.min(Math.ceil(sr / F_MIN), (x.length >> 1) - 2);
  if (tauMax <= tauMin + 2) return null;
  const W = x.length - tauMax - 1;
  const d = new Float32Array(tauMax + 2);
  let suma = 0;
  d[0] = 1;
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let j = 0; j < W; j++) { const e = x[j] - x[j + tau]; s += e * e; }
    suma += s;
    d[tau] = suma > 0 ? s * tau / suma : 1;
  }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (d[t] < 0.15) {
      while (t + 1 <= tauMax && d[t + 1] < d[t]) t++;
      tau = t; break;
    }
  }
  if (tau < 0) {
    let m = Infinity;
    for (let t = tauMin; t <= tauMax; t++) if (d[t] < m) { m = d[t]; tau = t; }
  }
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a - 2 * b + c;
  const fino = tau + (den > 1e-12 ? 0.5 * (a - c) / den : 0);
  return { f: sr / fino, claridad: 1 - b };
}

// Envolvente espectral por predicción lineal, en dB sobre la rejilla fija.
function envolvente(x, sr) {
  const n = x.length, orden = Math.min(20, Math.round(sr / 1000) + 2);
  const w = new Float64Array(n);
  for (let i = 0; i < n; i++)
    w[i] = (x[i] - (i ? 0.97 * x[i - 1] : 0)) * (0.54 - 0.46 * Math.cos(2 * Math.PI * i / (n - 1)));
  const r = new Float64Array(orden + 1);
  for (let k = 0; k <= orden; k++) { let s = 0; for (let i = k; i < n; i++) s += w[i] * w[i - k]; r[k] = s; }
  if (r[0] <= 1e-12) return null;
  r[0] *= 1.0001;                                   // estabiliza
  const a = new Float64Array(orden + 1), tmp = new Float64Array(orden + 1);
  a[0] = 1; let err = r[0];
  for (let i = 1; i <= orden; i++) {                // Levinson–Durbin
    let acc = r[i];
    for (let j = 1; j < i; j++) acc += a[j] * r[i - j];
    const k = -acc / err;
    tmp.set(a);
    for (let j = 1; j < i; j++) a[j] = tmp[j] + k * tmp[i - j];
    a[i] = k; err *= 1 - k * k;
    if (err <= 0) return null;
  }
  const env = new Float32Array(ENV_BINS);
  for (let b = 0; b < ENV_BINS; b++) {
    const om = 2 * Math.PI * (b * ENV_MAX / ENV_BINS) / sr;
    let re = 0, im = 0;
    for (let m = 0; m <= orden; m++) { re += a[m] * Math.cos(om * m); im -= a[m] * Math.sin(om * m); }
    env[b] = -10 * Math.log10(re * re + im * im + 1e-20);
  }
  return env;
}

// Picos de la envolvente promedio: las resonancias de la voz.
function resonancias(env) {
  const hz = ENV_MAX / ENV_BINS, vecindad = Math.round(280 / hz), picos = [];
  for (let b = Math.ceil(220 / hz); b < Math.floor(3600 / hz); b++) {
    if (!(env[b] > env[b - 1] && env[b] >= env[b + 1])) continue;
    let izq = Infinity, der = Infinity;
    for (let k = 1; k <= vecindad; k++) {
      if (b - k >= 0) izq = Math.min(izq, env[b - k]);
      if (b + k < ENV_BINS) der = Math.min(der, env[b + k]);
    }
    if (env[b] - Math.max(izq, der) < 1.2) continue;  // poco marcado
    const a = env[b - 1], c = env[b + 1], den = a - 2 * env[b] + c;
    picos.push((b + (den < 0 ? 0.5 * (a - c) / den : 0)) * hz);
  }
  return picos.slice(0, 3);
}

// Acumula tramos de audio y entrega el resultado final.
function crearAnalisis(sr) {
  const factor = Math.max(1, Math.round(sr / 16000)), srD = sr / factor;
  const f0s = [], envSuma = new Float32Array(ENV_BINS);
  let envN = 0, picoRms = 0;
  return {
    largoTramo: Math.round(sr * 0.085),
    tramo(x) {                         // devuelve f0 instantáneo o null
      const nivel = rms(x);
      picoRms = Math.max(picoRms, nivel);
      if (nivel < 0.003) return null;
      const y = decimar(x, factor), p = tono(y, srD);
      if (!p || p.claridad < 0.8 || p.f < F_MIN || p.f > F_MAX) return null;
      f0s.push({ f: p.f, nivel });
      const e = envolvente(y, srD);
      if (e) { for (let i = 0; i < ENV_BINS; i++) envSuma[i] += e[i]; envN++; }
      return p.f;
    },
    sonoros() { return f0s.length; },
    resultado(minimo) {
      const fuertes = f0s.filter(v => v.nivel > picoRms * 0.15).map(v => v.f).sort((a, b) => a - b);
      if (fuertes.length < minimo) return null;
      const f0 = fuertes[fuertes.length >> 1];
      let picos = [];
      if (envN) { for (let i = 0; i < ENV_BINS; i++) envSuma[i] /= envN; envN = 0; picos = resonancias(envSuma); }
      return { f0, resonancias: picos };
    }
  };
}

function analizarGrabacion(x, sr) {
  const an = crearAnalisis(sr), L = an.largoTramo, salto = Math.round(sr * 0.03);
  for (let i = 0; i + L <= x.length; i += salto) an.tramo(x.subarray(i, i + L));
  return an.resultado(8);
}

const NOTAS = ['Do', 'Do♯', 'Re', 'Re♯', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'La♯', 'Si'];
function nombreNota(f) {
  const midi = Math.round(69 + 12 * Math.log2(f / 440));
  return NOTAS[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}
function matiz(f) {                    // un color por nota, continuo en la octava
  const pc = ((12 * Math.log2(f / 440)) % 12 + 12) % 12;
  return (255 + pc * 30) % 360;
}
//</dsp>

/* ===== Música ============================================================== */
const ESCALA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3];          // pentatónica justa sobre la voz
const ACORDES = [[0, 2, 3], [0, 1, 3], [1, 3, 4], [0, 2, 4], [0, 3, 4]];
const RESPIRO = 0.1;                                      // Hz: un ciclo cada 10 s

let ac = null, musica = null;

function contexto() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function sala(ctx) {                                      // reverberación generada
  const dur = 4.5, n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c); let lp = 0;
    for (let i = 0; i < n; i++) {
      const t = i / n;
      lp += (Math.random() * 2 - 1 - lp) * (0.35 - 0.25 * t);   // se oscurece al apagarse
      d[i] = lp * Math.pow(1 - t, 2.4);
    }
  }
  const conv = ctx.createConvolver(); conv.buffer = buf; return conv;
}

function crearMusica(ctx, f0, formantes, volumen, alSonar) {
  let raiz = f0;
  while (raiz >= 165) raiz /= 2;
  while (raiz < 82.5) raiz *= 2;
  const f1 = formantes[0] || 600, f2 = formantes[1] || 1150;

  const t0 = ctx.currentTime + 0.05;
  const salida = ctx.createGain(); salida.gain.value = 0;
  const limite = ctx.createDynamicsCompressor();
  limite.threshold.value = -16; limite.ratio.value = 4; limite.attack.value = 0.02; limite.release.value = 0.4;
  salida.connect(limite).connect(ctx.destination);

  const rev = sala(ctx), revIda = ctx.createGain(), revVuelta = ctx.createGain();
  revVuelta.gain.value = 0.55; revIda.connect(rev).connect(revVuelta).connect(salida);

  const fuentes = [];
  const osc = (tipo, f, desafino) => {
    const o = ctx.createOscillator(); o.type = tipo; o.frequency.value = f;
    if (desafino) o.detune.value = desafino;
    fuentes.push(o); return o;
  };

  // Bordón: la frecuencia de la voz y su quinta, respirando despacio.
  const bordon = ctx.createGain(); bordon.gain.value = 0.62;
  const lfo = osc('sine', RESPIRO), hondo = ctx.createGain(); hondo.gain.value = 0.3;
  lfo.connect(hondo).connect(bordon.gain); lfo.start(t0);
  [[0.5, 0.1], [1, 0.11], [1.5, 0.04], [2, 0.05], [3, 0.012], [4, 0.018]].forEach(([m, g]) => {
    [-1, 1].forEach(lado => {
      const o = osc('sine', raiz * m + lado * 0.11), v = ctx.createGain(); v.gain.value = g;
      o.connect(v).connect(bordon); o.start(t0);
    });
  });
  bordon.connect(salida); bordon.connect(revIda);

  // Colchón: acordes lentos filtrados por las resonancias de la voz.
  const colchon = ctx.createGain(), pasaBajos = ctx.createBiquadFilter(), colchonOut = ctx.createGain();
  pasaBajos.type = 'lowpass'; pasaBajos.frequency.value = 2200; pasaBajos.Q.value = 0.3;
  colchonOut.gain.value = 0.085;
  colchon.connect(pasaBajos);
  [[null, 0.3], [f1, 1.1], [f2, 0.7]].forEach(([f, g]) => {
    const v = ctx.createGain(); v.gain.value = g;
    if (f) {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 4.5;
      pasaBajos.connect(bp).connect(v);
    } else pasaBajos.connect(v);
    v.connect(colchonOut);
  });
  colchonOut.connect(salida); colchonOut.connect(revIda);

  function acorde(t, grados) {
    const dura = 22;
    grados.forEach((g, i) => {
      const f = raiz * 2 * ESCALA[g] * (i === 2 && Math.random() < 0.4 ? 2 : 1);
      const v = ctx.createGain();
      v.gain.setValueAtTime(0, t);
      v.gain.linearRampToValueAtTime(0.33, t + 7);
      v.gain.setValueAtTime(0.33, t + dura - 9);
      v.gain.linearRampToValueAtTime(0, t + dura);
      [-5, 5].forEach(c => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c; o.connect(v); o.start(t); o.stop(t + dura + 0.1); });
      v.connect(colchon);
    });
  }

  // Campanas: notas sueltas que caminan por la escala.
  const eco = ctx.createDelay(2), ecoVuelta = ctx.createGain(), campanas = ctx.createGain();
  eco.delayTime.value = 0.62; ecoVuelta.gain.value = 0.32; campanas.gain.value = 0.5;
  campanas.connect(salida); campanas.connect(revIda);
  campanas.connect(eco); eco.connect(ecoVuelta).connect(eco); eco.connect(salida); eco.connect(revIda);
  const gama = [];
  for (let o = 2; o <= 4; o *= 2) ESCALA.forEach(r => gama.push(raiz * o * r));
  gama.push(raiz * 8);
  let paso = 5;

  function campana(t) {
    paso = Math.max(0, Math.min(gama.length - 1, paso + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)]));
    const f = gama[paso], v = ctx.createGain(), lado = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const fuerza = 0.2 * Math.min(1, 520 / f + 0.35);
    v.gain.setValueAtTime(0, t);
    v.gain.linearRampToValueAtTime(fuerza, t + 0.12);
    v.gain.setTargetAtTime(0, t + 0.12, 1.6);
    [[1, 1], [2, 0.12], [3, 0.03]].forEach(([m, g]) => {
      const o = ctx.createOscillator(), p = ctx.createGain();
      o.frequency.value = f * m; p.gain.value = g; o.connect(p).connect(v); o.start(t); o.stop(t + 10);
    });
    if (lado) { lado.pan.value = Math.random() * 1.2 - 0.6; v.connect(lado).connect(campanas); } else v.connect(campanas);
    alSonar(f, t);
  }

  let proxAcorde = t0, proxCampana = t0 + 5, reloj = null, ultimo = -1;
  function agenda(hasta) {
    if (typeof hasta !== 'number') hasta = ctx.currentTime + 4;
    while (proxAcorde < hasta) {
      let i; do { i = Math.floor(Math.random() * ACORDES.length); } while (i === ultimo);
      ultimo = i; acorde(proxAcorde, ACORDES[i]); proxAcorde += 14;
    }
    while (proxCampana < hasta) {
      campana(proxCampana);
      if (Math.random() < 0.3) campana(proxCampana + 0.62);
      proxCampana += 2.8 + Math.random() * 4.5;
    }
  }

  return {
    raiz, t0, agenda,
    sonar() {
      const t = ctx.currentTime;
      proxAcorde = Math.max(proxAcorde, t + 0.1); proxCampana = Math.max(proxCampana, t + 3);
      agenda(); reloj = setInterval(agenda, 1000);
      salida.gain.cancelScheduledValues(t); salida.gain.setValueAtTime(salida.gain.value, t);
      salida.gain.linearRampToValueAtTime(volumen, t + 4);
    },
    callar(rapido) {
      clearInterval(reloj); reloj = null;
      const t = ctx.currentTime;
      salida.gain.cancelScheduledValues(t); salida.gain.setValueAtTime(salida.gain.value, t);
      salida.gain.linearRampToValueAtTime(0, t + (rapido ? 0.3 : 1.6));
    },
    volumen(v) { volumen = v; if (reloj) salida.gain.setTargetAtTime(v, ctx.currentTime, 0.1); },
    cerrar() {
      this.callar(true);
      setTimeout(() => { fuentes.forEach(o => { try { o.stop(); } catch (e) {} }); salida.disconnect(); }, 500);
    }
  };
}

/* ===== Interfaz ============================================================ */
const $ = id => document.getElementById(id);
const aro = $('aro'), lienzo = $('lienzo'), g = lienzo.getContext('2d');
const elValor = $('valor'), elNota = $('nota'), elPista = $('pista'), elRes = $('resonancias');
const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ESCUCHA = 6;                       // segundos de micrófono

let estado = 'inicio';                   // inicio | escuchando | analizando | sonando | pausa
let voz = null, mic = null, ondas = [], color = [185, 167, 240];

function pista(texto, aviso) { elPista.textContent = texto; elPista.classList.toggle('aviso', !!aviso); }
function hz(f) { return f < 100 ? f.toFixed(1).replace('.', ',') : String(Math.round(f)); }
function mostrarHz(f) { elValor.innerHTML = hz(f) + '<small>Hz</small>'; }

function hsl(h, s, l) {                  // → [r,g,b] para el lienzo
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))));
}

function cambiar(nuevo) {
  estado = nuevo;
  const hay = !!voz;
  $('volumen').hidden = !hay; $('otra').hidden = !hay; elRes.hidden = !(hay && voz.resonancias.length);
  if (nuevo === 'inicio') { elValor.textContent = 'Escuchar'; elNota.textContent = ''; }
  if (nuevo === 'escuchando') { elValor.textContent = '···'; elNota.textContent = ''; pista('Escuchando. Toca para terminar.'); }
  if (nuevo === 'analizando') { elValor.textContent = '···'; elNota.textContent = ''; pista('Analizando el audio.'); }
  if (nuevo === 'sonando') pista('Toca para pausar.');
  if (nuevo === 'pausa') pista('Toca para seguir.');
  aro.setAttribute('aria-label', { inicio: 'Escuchar mi voz', escuchando: 'Terminar de escuchar', analizando: 'Analizando', sonando: 'Pausar la música', pausa: 'Reanudar la música' }[nuevo]);
}

function presentar(r) {
  voz = r;
  const h = matiz(r.f0);
  color = hsl(h, 62, 79);
  document.documentElement.style.setProperty('--voz', `rgb(${color.join(' ')})`);
  mostrarHz(r.f0); elNota.textContent = nombreNota(r.f0);
  elRes.querySelectorAll('dd').forEach(n => n.remove());
  r.resonancias.forEach(f => { const dd = document.createElement('dd'); dd.textContent = Math.round(f / 10) * 10 + ' Hz'; elRes.appendChild(dd); });
  if (musica) musica.cerrar();
  ondas = [];
  musica = crearMusica(contexto(), r.f0, r.resonancias, +$('vol').value, (f, t) => {
    setTimeout(() => { if (estado === 'sonando') ondas.push({ t: performance.now(), f }); }, Math.max(0, (t - ac.currentTime) * 1000));
  });
  musica.sonar();
  cambiar('sonando');
}

function sinVoz() {
  cambiar(voz ? 'pausa' : 'inicio');
  if (voz) { mostrarHz(voz.f0); elNota.textContent = nombreNota(voz.f0); }
  pista('No distinguí una voz. Acércate y sostén una «aaa».', true);
}

async function escuchar() {
  if (mic || estado === 'analizando') return;
  const ctx = contexto();
  if (musica && estado === 'sonando') musica.callar(true);
  let flujo;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sin micrófono');
    flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    cambiar(voz ? 'pausa' : 'inicio');
    pista('No pude usar el micrófono. Permite el acceso o sube un audio.', true);
    return;
  }
  const fuente = ctx.createMediaStreamSource(flujo), analizador = ctx.createAnalyser();
  const an = crearAnalisis(ctx.sampleRate);
  analizador.fftSize = 4096; fuente.connect(analizador);
  mic = { flujo, fuente, analizador, an, datos: new Float32Array(4096), inicio: performance.now(), recientes: [] };
  cambiar('escuchando');
}

function terminarEscucha() {
  if (!mic) return;
  mic.flujo.getTracks().forEach(p => p.stop()); mic.fuente.disconnect();
  const r = mic.an.resultado(12); mic = null;
  if (r) presentar(r); else sinVoz();
}

async function abrirArchivo(archivo) {
  if (!archivo) return;
  const ctx = contexto();
  if (mic) { mic.flujo.getTracks().forEach(p => p.stop()); mic.fuente.disconnect(); mic = null; }
  if (musica && estado === 'sonando') musica.callar(true);
  cambiar('analizando');
  try {
    const bytes = await archivo.arrayBuffer();
    const audio = await new Promise((ok, mal) => { const p = ctx.decodeAudioData(bytes, ok, mal); if (p && p.catch) p.catch(mal); });
    const n = Math.min(audio.length, Math.floor(audio.sampleRate * 45)), x = new Float32Array(n);
    for (let c = 0; c < audio.numberOfChannels; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) x[i] += d[i] / audio.numberOfChannels; }
    let tope = 0;
    for (let i = 0; i < n; i++) tope = Math.max(tope, Math.abs(x[i]));
    if (tope > 0) for (let i = 0; i < n; i++) x[i] *= 0.9 / tope;
    await new Promise(r => setTimeout(r, 30));           // deja pintar «Analizando»
    const r = analizarGrabacion(x, audio.sampleRate);
    if (r) presentar(r); else sinVoz();
  } catch (e) {
    cambiar(voz ? 'pausa' : 'inicio');
    if (voz) { mostrarHz(voz.f0); elNota.textContent = nombreNota(voz.f0); }
    pista('No pude leer ese archivo. Prueba con otro audio.', true);
  }
}

aro.addEventListener('click', () => {
  if (estado === 'inicio') escuchar();
  else if (estado === 'escuchando') terminarEscucha();
  else if (estado === 'sonando') {
    musica.callar(); cambiar('pausa');
    setTimeout(() => { if (estado === 'pausa' && ac.state === 'running') ac.suspend(); }, 2200);
  }
  else if (estado === 'pausa') { contexto(); musica.sonar(); cambiar('sonando'); }
});
$('otra').addEventListener('click', escuchar);
$('archivo').addEventListener('change', e => { abrirArchivo(e.target.files[0]); e.target.value = ''; });
$('vol').addEventListener('input', e => { if (musica) musica.volumen(+e.target.value); });

/* ----- El aro ----- */
function medir() {
  const d = Math.min(window.devicePixelRatio || 1, 2.5), r = lienzo.getBoundingClientRect();
  lienzo.width = Math.round(r.width * d); lienzo.height = Math.round(r.height * d);
}
window.addEventListener('resize', medir); medir();

const tinta = a => `rgba(${color[0]},${color[1]},${color[2]},${a})`;
function circulo(cx, cy, r, ancho, alfa) {
  g.beginPath(); g.arc(cx, cy, Math.max(0.5, r), 0, 6.2832); g.lineWidth = ancho; g.strokeStyle = tinta(alfa); g.stroke();
}

function cuadro(ahora) {
  const w = lienzo.width, cx = w / 2, cy = lienzo.height / 2, u = w / 380, R = w * 0.33;
  g.clearRect(0, 0, w, lienzo.height);

  if (estado === 'escuchando' && mic) {
    const m = mic; m.analizador.getFloatTimeDomainData(m.datos);
    const L = m.an.largoTramo, f = m.an.tramo(m.datos.subarray(4096 - Math.min(L, 4096)));
    if (f) { m.recientes.push(f); if (m.recientes.length > 9) m.recientes.shift(); mostrarHz([...m.recientes].sort((a, b) => a - b)[m.recientes.length >> 1]); }
    const avance = (ahora - m.inicio) / (ESCUCHA * 1000);
    g.beginPath();                                       // la onda, enrollada
    for (let i = 0; i <= 360; i++) {
      const s = m.datos[(i % 360) * 4] * (0.5 - 0.5 * Math.cos(i / 360 * 6.2832));
      const r = R * (1 + Math.max(-0.3, Math.min(0.3, s * 1.6))), a = i / 360 * 6.2832 - 1.5708;
      i ? g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : g.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
    g.lineWidth = 1.6 * u; g.strokeStyle = tinta(0.9); g.stroke();
    g.beginPath(); g.arc(cx, cy, R * 1.36, -1.5708, -1.5708 + 6.2832 * Math.min(1, avance));
    g.lineWidth = 1.2 * u; g.strokeStyle = tinta(0.35); g.stroke();
    if (avance >= 1) terminarEscucha();
  } else if (voz && (estado === 'sonando' || estado === 'pausa')) {
    const vivo = estado === 'sonando' && !quieto;
    const aire = vivo ? 0.5 + 0.5 * Math.sin(6.2832 * RESPIRO * (ac.currentTime - musica.t0)) : 0.5;
    const r0 = R * (0.94 + 0.09 * aire);
    g.shadowColor = tinta(0.55); g.shadowBlur = (10 + 22 * aire) * u;
    circulo(cx, cy, r0, 2.2 * u, estado === 'sonando' ? 0.95 : 0.5);
    g.shadowBlur = 0;
    voz.resonancias.forEach((f, i) => circulo(cx, cy, r0 + (15 + 13 * i) * u, 1 * u, 0.26 - 0.06 * i));
    if (vivo) {
      ondas = ondas.filter(o => ahora - o.t < 5200);
      ondas.forEach(o => { const k = (ahora - o.t) / 5200; circulo(cx, cy, r0 + k * (w / 2 - r0 - 2 * u), 1.2 * u, 0.5 * (1 - k) * (1 - k)); });
    }
  } else {
    circulo(cx, cy, R, 1.6 * u, estado === 'analizando' ? 0.35 : 0.8);
  }
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
cambiar('inicio');
</script>
